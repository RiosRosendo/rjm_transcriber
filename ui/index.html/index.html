<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistente de Juntas</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    padding: 24px;
    text-align: center;
    background-color: #fafafa;
    color: #222;
  }
  h2 { margin-bottom: 4px; }
  .subtitle { color: #777; font-size: 13px; margin-bottom: 24px; }
  button {
    font-size: 16px;
    padding: 14px 28px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background-color: #d9534f;
    color: white;
    transition: background-color 0.2s;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.recording { background-color: #5cb85c; }
  #status { margin-top: 16px; font-size: 14px; color: #555; min-height: 20px; }
  #recap {
    text-align: left;
    margin-top: 20px;
    white-space: pre-wrap;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    padding: 16px;
    border-radius: 10px;
    max-height: 360px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h2>Asistente de Juntas</h2>
  <div class="subtitle">Todo corre local en tu computadora</div>
  <button id="recordBtn" onclick="toggleRecording()">Grabar junta</button>
  <div id="status">Listo</div>
  <div id="recap"></div>

<script>
let recording = false;

async function toggleRecording() {
  const btn = document.getElementById("recordBtn");
  const status = document.getElementById("status");
  const recapDiv = document.getElementById("recap");

  if (!recording) {
    const result = await window.pywebview.api.start_recording();
    if (result.status === "error") {
      status.textContent = "Error: " + result.message;
      return;
    }
    recording = true;
    btn.textContent = "Detener y generar resumen";
    btn.classList.add("recording");
    status.textContent = "Grabando... presiona el boton al terminar la junta.";
    recapDiv.textContent = "";
  } else {
    btn.disabled = true;
    status.textContent = "Procesando (transcribiendo y generando resumen, puede tardar unos minutos)...";
    const result = await window.pywebview.api.stop_recording_and_process();
    btn.disabled = false;
    recording = false;
    btn.textContent = "Grabar junta";
    btn.classList.remove("recording");

    if (result.status === "done") {
      status.textContent = "Listo. Recap generado.";
      recapDiv.textContent = result.recap;
    } else {
      status.textContent = "Error: " + result.message;
    }
  }
}
</script>
</body>
</html>
